spring:
  datasource:
    url: jdbc:h2:mem:tripplandb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: change-this-to-a-long-random-secret-key-please

logging:
  level:
    org.hibernate.SQL: debug