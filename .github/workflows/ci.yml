# PR · main에 올라온 코드를 자동으로 검사한다 (#91)
# - 백엔드: ./gradlew test (테스트는 H2 임시 DB를 써서 DB 접속 정보 · 키 없이 돈다)
# - 프론트: npm ci → npm run lint → npm run build
# - 바뀐 폴더만 검사한다. 문서만 바뀌면 둘 다 건너뛴다
# - main 브랜치 보호에는 마지막의 "CI 결과" 하나만 필수로 걸면 된다 (건너뛴 검사도 통과로 본다)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 코드를 읽기만 한다
permissions:
  contents: read

# 같은 PR에 새로 push하면 이전 검사는 멈추고 새 것만 돈다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 폴더 확인
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 이 파일(CI 설정)이 바뀌면 둘 다 검사한다
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: 백엔드 테스트
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle과 내려받은 라이브러리를 저장해 두고 다음 실행에서 다시 쓴다
      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test

      # 실패한 테스트를 Actions 요약 화면에 바로 보여준다 (로그를 뒤지지 않아도 되게)
      - name: 테스트 결과 요약
        if: always()
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const dir = "build/test-results/test";
          if (!fs.existsSync(dir)) {
            console.log("### 백엔드 테스트\n테스트 결과가 없습니다. 컴파일 단계에서 실패했을 수 있습니다. 로그를 확인하세요.");
            process.exit(0);
          }
          let total = 0, failed = 0, skipped = 0;
          const failures = [];
          for (const name of fs.readdirSync(dir).filter((file) => file.endsWith(".xml"))) {
            const xml = fs.readFileSync(`${dir}/${name}`, "utf8");
            const suite = xml.match(/<testsuite[^>]*>/)[0];
            const count = (key) => Number((suite.match(new RegExp(`${key}="(\\d+)"`)) || [0, 0])[1]);
            total += count("tests");
            failed += count("failures") + count("errors");
            skipped += count("skipped");
            for (const test of xml.matchAll(/<testcase name="([^"]*)" classname="([^"]*)"[^>]*>\s*<(failure|error)/g)) {
              failures.push(`- \`${test[2].split(".").pop()}\` ${test[1]}`);
            }
          }
          console.log(`### 백엔드 테스트 ${failed === 0 ? "✅" : "❌"}`);
          console.log(`전체 ${total}개 · 실패 ${failed}개 · 건너뜀 ${skipped}개`);
          if (failures.length > 0) {
            console.log("\n**실패한 테스트**");
            console.log(failures.join("\n"));
          }
          EOF

      # 실패하면 HTML 보고서를 내려받을 수 있게 남긴다 (7일 보관)
      - name: 테스트 보고서 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트 lint · build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 설치한다 (npm install과 달리 lock 파일을 바꾸지 않는다)
      - name: 의존성 설치
        run: npm ci

      - name: lint
        run: npm run lint

      # 키(VITE_*) 없이 빌드한다. 키는 Vercel에서 배포할 때만 들어간다
      - name: build
        run: npm run build

  # main 브랜치 보호의 필수 검사로 쓰는 마지막 단계
  # 백엔드 · 프론트 중 실패하거나 취소된 것이 있으면 실패, 건너뛴 것은 통과로 본다
  result:
    name: CI 결과
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "검사 결과: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "실패한 검사가 있습니다."
              exit 1
            fi
          done
          echo "모두 통과 (건너뛴 검사 포함)"
