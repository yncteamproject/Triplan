# 배포 서버(EC2)의 Nginx 설정 (docs/deploy.md)
# /etc/nginx/sites-available/triplan에 복사하고 sites-enabled에 연결해서 쓴다
# {이름}을 DuckDNS에서 만든 이름으로 바꾼다. 예: triplan-ync
#
# - https 인증서는 Certbot이 받고 자동으로 갱신한다 (/etc/letsencrypt/live/{이름}.duckdns.org/)
# - 백엔드 두 칸(8081 · 8082)을 모두 등록해 두고, 배포할 때도 이 설정은 고치지 않는다 (Nginx를 reload하지 않음)
#   평소에는 한 칸만 켜져 있다. 꺼진 칸으로 간 요청은 연결이 거부되고, 아래 proxy_next_upstream으로 바로 다른 칸에 다시 보낸다.
#   (전환 순서는 deploy/blue-green.sh: 새 칸 실행 → 확인 → 옛 칸 종료)
#
# max_fails=0: "실패한 칸을 일정 시간 건너뛰기"를 끈다.
#   처음에는 max_fails=1 fail_timeout=5s로 두었는데, 새 칸이 켜지는 동안 연결 거부가 쌓여 "죽은 칸"으로 기억된 상태에서
#   옛 칸을 끄면 Nginx가 두 칸 모두 죽었다고 보고 최대 5초 동안 502를 냈다 (no live upstreams, 배포 한 번에 31건 실패).
#   끄면 매번 연결을 시도하고 거부되면 즉시 다른 칸으로 넘긴다. 서버 안의 연결 거부는 매우 빨라서 손해가 거의 없다.
#   대신 꺼진 칸에 연결해 본 요청마다 error.log에 "connect() failed (111)" 한 줄이 남는다 (정상 동작).

upstream triplan_backend {
	server 127.0.0.1:8081 max_fails=0;
	server 127.0.0.1:8082 max_fails=0;
}

# http로 오면 https로 보낸다. 인증서 갱신 확인(/.well-known/acme-challenge/)만 http로 받는다
server {
	listen 80;
	listen [::]:80;
	server_name {이름}.duckdns.org;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name {이름}.duckdns.org;

	ssl_certificate /etc/letsencrypt/live/{이름}.duckdns.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/{이름}.duckdns.org/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# 글 본문 등 요청 크기 제한 (기본 1MB)
	client_max_body_size 2m;

	location / {
		proxy_pass http://triplan_backend;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# 백엔드가 실제 접속한 사람의 IP를 알 수 있게 넘긴다 (Nginx 뒤에서는 모두 127.0.0.1로 보이므로)
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 5s;
		proxy_read_timeout 60s;
		# 한 칸에서 연결이 거부되거나(error) 그 칸이 502 · 503을 내면 다른 칸으로 한 번 더 보낸다
		# 연결 전에 거부된 요청은 POST도 다시 보내고, 이미 보낸 POST는 다시 보내지 않는다 (Nginx 기본 동작)
		proxy_next_upstream error timeout http_502 http_503;
		proxy_next_upstream_tries 2;
		proxy_next_upstream_timeout 10s;
	}
}
