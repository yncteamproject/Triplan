# 배포 서버용 비밀 값 예시. 서버의 /opt/triplan/application-secret.yaml로 복사해서 값을 채운다 (docs/deploy.md)
# 실제 값을 채운 파일은 서버에만 두고 저장소에 올리지 않는다
spring:
  datasource:
    url: jdbc:postgresql://{호스트}/{DB이름}?sslmode=require
    username: {계정}
    password: {비밀번호}
    driver-class-name: org.postgresql.Driver

jwt:
  # 각자 컴퓨터에서 쓰는 키와 다른 값으로 새로 만든다 (openssl rand -base64 48)
  secret_key: {Base64 비밀키, 32바이트 이상}

odsay:
  # 오디세이(ODsay LAB)에 서버의 고정 IP를 등록한 키
  api-key: {오디세이 키}

app:
  cors:
    # API를 부를 수 있는 화면 주소 = Vercel 주소. 끝에 / 를 붙이지 않는다. 여러 개면 쉼표로 구분
    allowed-origins: https://{프로젝트}.vercel.app
