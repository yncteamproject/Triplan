# 인증서를 처음 받을 때만 잠깐 쓰는 Nginx 설정 (docs/deploy.md 6번 "https 열기")
# 인증서 파일이 아직 없으면 https 설정(nginx-triplan.conf)으로는 Nginx가 켜지지 않는다.
# 그래서 먼저 http만 열어 Certbot이 도메인 확인을 받게 하고, 인증서를 받은 뒤 nginx-triplan.conf로 바꾼다.
# {이름}을 DuckDNS에서 만든 이름으로 바꾼다
server {
	listen 80;
	listen [::]:80;
	server_name {이름}.duckdns.org;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 503;
	}
}
